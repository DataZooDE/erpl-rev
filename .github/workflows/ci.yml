name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Required for the GitHub OIDC → AWS role assumption used to fetch the NW RFC SDK.
permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    name: Build server + run tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build unzip

      # vcpkg pinned to the manifest's builtin-baseline so Catch2 resolves
      # deterministically; the action exports VCPKG_ROOT for the Makefile.
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 11bbc873e00e9e58d4e9dffb30b7a5493a030e0b

      # Same mechanism as DataZooDE/erpl: assume the shared OIDC role and pull
      # the proprietary SAP NW RFC SDK from S3 (it can't be committed/redistributed).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::331993160594:role/ErplGithubOicdRole
          role-session-name: ErplRevGithubOidcSession
          aws-region: eu-west-1

      - name: Download SAP NW RFC SDK (Linux)
        run: ./scripts/download_and_extract_nwrfc.sh 's3://erpl-resources/sapnwrfc/nwrfc750P_13-70002752_linux.zip' './nwrfcsdk/linux/'

      - name: Build (server + tests)
        run: make build

      - name: Run tests
        run: make test
