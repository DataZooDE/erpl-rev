name: Release bundles

# Builds the single-file self-extracting binary for Linux, macOS and Windows.
# Run manually (workflow_dispatch) or on a version tag (v*), which also publishes
# a GitHub release with the three artifacts attached AND a linux/amd64 Docker
# image (ghcr.io/datazoode/erpl-rev:<version> + :latest).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  id-token: write      # GitHub OIDC -> AWS (fetch the SAP NW RFC SDK from S3)
  contents: write      # create releases

env:
  # Must match CMakeLists.txt and the duckdb/ submodule tag: it is passed as
  # DUCKDB_EXPLICIT_VERSION, so a mismatch both mislabels the engine and sends
  # it looking for extensions built for a version it is not.
  DUCKDB_VERSION: "1.5.5"

jobs:
  posix:
    name: bundle ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # rfc: which RFC implementation to link. `proto` is erpl-proto's
          # pure-Rust one, linked statically, so the bundle carries no SAP NW
          # RFC SDK and no ICU on any platform.
          #
          # Evidence differs by platform, and it is worth being clear about it.
          # Linux is the combination the 13-stage live suite runs against a real
          # ABAP system. macOS and Windows are proven to compile, link, load and
          # answer RfcGetVersion (erpl-proto's `cross` CI job plus the smoke test
          # below) -- but NOT yet against a live SAP system. See erpl-rev#75.
          - { os: ubuntu-latest, sub: linux, plat: linux, triplet: x64-linux,
              sdk: nwrfc750P_13-70002752_linux.zip,
              asset: erpl-rev-linux-amd64, rfc: proto }
          - { os: macos-14, sub: osx, plat: osx, triplet: arm64-osx,
              sdk: nwrfc750P_13-80008131_osx_arm.zip,
              asset: erpl-rev-macos-arm64, rfc: proto }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # duckdb (linked statically) + posthog-telemetry

      - name: Install build tools
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ninja-build unzip;
          else brew install ninja; fi

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 11bbc873e00e9e58d4e9dffb30b7a5493a030e0b

      # Only the SDK arms pull from S3; the proto arm needs no AWS at all.
      - name: Configure AWS credentials
        if: matrix.rfc == 'sdk'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::331993160594:role/ErplGithubOicdRole
          role-session-name: ErplRevReleaseOidc
          aws-region: eu-west-1

      - name: Fetch SAP NW RFC SDK
        if: matrix.rfc == 'sdk'
        run: ./scripts/download_and_extract_nwrfc.sh "s3://erpl-resources/sapnwrfc/${{ matrix.sdk }}" "./nwrfcsdk/${{ matrix.sub }}/"

      # erpl-proto is private, so the checkout needs credentials. Reuse the
      # read-only GitHub App the other repositories already authenticate with
      # (erpl's _extension_build.yml mints tokens for erpl, erpl-bics, erpl-odp
      # and erpl-proto the same way) rather than minting a personal token that
      # belongs to one person and expires without warning.
      #
      # The two secrets must be visible to THIS repository: promote them to
      # organisation secrets with erpl-rev in scope, or add them here.
      - name: Mint a read-only token for erpl-proto
        if: matrix.rfc == 'proto'
        id: proto_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.REPO_READONLY_GITHUB_APP_ID }}
          private-key: ${{ secrets.REPO_READONLY_GITHUB_APP_KEY }}
          repositories: "erpl-proto"

      # No submodules: erpl-proto has none, and asking for them would widen the
      # access this token needs for nothing.
      - name: Check out erpl-proto (RFC backend)
        if: matrix.rfc == 'proto'
        uses: actions/checkout@v4
        with:
          repository: DataZooDE/erpl-proto
          token: ${{ steps.proto_token.outputs.token }}
          path: .erpl-proto

      - name: Build the pure-Rust RFC shim (static)
        if: matrix.rfc == 'proto'
        run: cargo build --release -p erpl-proto-nwrfc --manifest-path .erpl-proto/Cargo.toml

      # DuckDB is built from the pinned `duckdb/` submodule and linked in, so
      # there is no release zip to fetch and nothing to stage beside the binary.
      - name: Build (static DuckDB)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DERPL_REV_VERSION="${GITHUB_REF_NAME#v}" \
            -DDUCKDB_VERSION="${DUCKDB_VERSION}" \
            -DRFC_BACKEND="${RFC_BACKEND}" -DRFC_LINK="${RFC_LINK}" \
            -DERPL_PROTO_ROOT="$PWD/.erpl-proto"
          cmake --build build
        env:
          RFC_BACKEND: ${{ matrix.rfc }}
          RFC_LINK: ${{ matrix.rfc == 'proto' && 'static' || 'shared' }}

      - name: Stage the binary as the release asset
        run: |
          mkdir -p dist
          cp build/erpl_rev_server "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

      - name: Assert the binary links no SAP or DuckDB library
        if: matrix.rfc == 'proto'
        shell: bash
        run: |
          # The shim is inside the binary, so nothing SAP-shaped may be linked --
          # not even erpl-proto's own shared object. Matching on the resolved
          # path is not enough here: the shim is deliberately named
          # libsapnwrfc.so, so any RFC shared object at all is a failure.
          # ldd is Linux-only; macOS needs otool.
          if [ "${{ runner.os }}" = macOS ]; then
            deps="$(otool -L build/erpl_rev_server)"
          else
            deps="$(ldd build/erpl_rev_server)"
          fi
          if grep -Ei 'sapnwrfc|libsapucum|libicu' <<<"$deps"; then
            echo "::error::binary still links an RFC or ICU library"; exit 1
          fi
          if grep -Ei 'libduckdb' <<<"$deps"; then
            echo "::error::DuckDB is meant to be linked statically"; exit 1
          fi
          echo "no RFC, ICU or DuckDB shared object; the binary stands alone"

      - name: Smoke test (no external libs)
        run: env -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH "./dist/${{ matrix.asset }}" --smoke

      - name: Package (tar.gz preserves the exec bit)
        run: tar -czf "dist/${{ matrix.asset }}.tar.gz" -C dist "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}.tar.gz
          path: dist/${{ matrix.asset }}.tar.gz

      # The wheel wraps the raw binary, not the tarball.
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  windows:
    name: bundle erpl-rev-windows-amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # duckdb (linked statically) + posthog-telemetry

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 11bbc873e00e9e58d4e9dffb30b7a5493a030e0b

      # No AWS and no SDK: this arm links erpl-proto's pure-Rust shim instead.
      - name: Mint a read-only token for erpl-proto
        id: proto_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.REPO_READONLY_GITHUB_APP_ID }}
          private-key: ${{ secrets.REPO_READONLY_GITHUB_APP_KEY }}
          repositories: "erpl-proto"

      - name: Check out erpl-proto (RFC backend)
        uses: actions/checkout@v4
        with:
          repository: DataZooDE/erpl-proto
          token: ${{ steps.proto_token.outputs.token }}
          path: .erpl-proto

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the pure-Rust RFC shim (static)
        run: cargo build --release -p erpl-proto-nwrfc --manifest-path .erpl-proto/Cargo.toml

      - name: Build (static DuckDB)
        run: |
          # x64-windows-static: statically link OpenSSL (no libssl/libcrypto
          # DLLs beside the exe) and use the static CRT (/MT), which is what
          # DuckDB's own build forces.
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DERPL_REV_VERSION="$($env:GITHUB_REF_NAME -replace '^v','')" `
            -DDUCKDB_VERSION="$env:DUCKDB_VERSION" `
            -DRFC_BACKEND=proto -DRFC_LINK=static `
            -DERPL_PROTO_ROOT="$PWD/.erpl-proto"
          cmake --build build --config Release

      - name: Stage the binary as the release asset
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\Release\erpl_rev_server.exe dist\erpl-rev-windows-amd64.exe

      - name: Assert the binary links no SAP or DuckDB library
        shell: pwsh
        run: |
          # dumpbin is the Windows ldd, but cl.exe is not on PATH in this job, so
          # locate the toolchain with vswhere. If that fails, fall back to
          # scanning the image: a DLL import name appears verbatim as ASCII in
          # the PE import table, so the check still holds without the tool.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = $null
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products * -property installationPath
            if ($vs) { $dumpbin = Get-ChildItem -Path $vs -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue |
                                  Select-Object -First 1 -ExpandProperty FullName }
          }
          $exe = "build\Release\erpl_rev_server.exe"
          if ($dumpbin) {
            Write-Host "using $dumpbin"
            $deps = & $dumpbin /dependents $exe | Out-String
          } else {
            Write-Host "dumpbin not found; scanning the image for import names"
            $bytes = [System.IO.File]::ReadAllBytes($exe)
            $deps  = [System.Text.Encoding]::ASCII.GetString($bytes)
          }
          if ($deps -match 'sapnwrfc|sapucum|icuuc|icudt|icuin') {
            Write-Error "proto build still imports an RFC or ICU library"; exit 1
          }
          Write-Host "no RFC or ICU import; DuckDB is the only bundled library"

      - name: Smoke test (no external libs)
        run: .\dist\erpl-rev-windows-amd64.exe --smoke

      - name: Package (zip)
        run: Compress-Archive -Force -Path dist\erpl-rev-windows-amd64.exe -DestinationPath dist\erpl-rev-windows-amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: erpl-rev-windows-amd64.zip
          path: dist\erpl-rev-windows-amd64.zip

      # The wheel wraps the raw self-extracting exe, not the zip.
      - uses: actions/upload-artifact@v4
        with:
          name: binary-erpl-rev-windows-amd64
          path: dist\erpl-rev-windows-amd64.exe

  # --- PyPI -------------------------------------------------------------------
  # `uvx erpl-rev` / `pip install erpl-rev`, the same way erpl-adt ships: each
  # platform's prebuilt binary is wrapped in a wheel with bin-to-wheel. What gets
  # wrapped here is the server binary itself: DuckDB is linked in, so there is
  # no launcher, no payload to unpack and nothing else to install.
  # Deliberately NOT gated on a tag: building the wheels is the half of the PyPI
  # path that can fail for ordinary reasons (a renamed artefact, a missing
  # platform, a bin-to-wheel change), and a `workflow_dispatch` run rehearses it
  # for free. Publishing stays tag-only, so a dispatch proves the wheels without
  # burning a version number -- a PyPI release cannot be replaced.
  pypi-wheels:
    name: Build Python wheels
    needs: [posix, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # On a tag this is the release version. On a dispatch rehearsal
      # GITHUB_REF_NAME is the BRANCH, so the naive strip produced wheels
      # versioned "main" -- which bin-to-wheel happily accepted. Use a valid
      # placeholder there, and validate either way: a malformed tag would
      # otherwise sail through the whole release and fail at the upload, with
      # the artefacts already built and the tag already pushed.
      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="0.0.0.dev0+$(git rev-parse --short HEAD)"
          fi
          pip install -q packaging
          python -c "import sys; from packaging.version import Version; Version(sys.argv[1])" "$v" \
            || { echo "::error::'$v' is not a valid PEP 440 version"; exit 1; }
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "wheel version: $v"

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: binaries

      - name: Build a wheel per platform
        run: |
          pip install "bin-to-wheel @ git+https://github.com/DataZooDE/bin-to-wheel.git@main"
          mkdir -p dist
          # <artifact dir>:<file in it>:<bin-to-wheel platform>
          entries=(
            "binary-erpl-rev-linux-amd64:erpl-rev-linux-amd64:linux-x86_64"
            "binary-erpl-rev-macos-arm64:erpl-rev-macos-arm64:macos-arm64"
            "binary-erpl-rev-windows-amd64:erpl-rev-windows-amd64.exe:windows-x64"
          )
          for e in "${entries[@]}"; do
            IFS=: read -r dir file plat <<<"$e"
            path="binaries/$dir/$file"
            # A missing binary must fail the release, not warn: a silently
            # absent platform would publish an incomplete set to PyPI, and PyPI
            # releases cannot be replaced.
            [ -f "$path" ] || { echo "::error::missing $path"; exit 1; }
            chmod +x "$path" || true
            python -m bin_to_wheel \
              --name erpl-rev \
              --version "${{ steps.version.outputs.v }}" \
              --binary "$path" \
              --platform "$plat" \
              --output-dir dist \
              --entry-point erpl-rev \
              --description "SAP RFC server bridging ABAP into DuckDB" \
              --author "DataZoo GmbH" \
              --license BUSL-1.1 \
              --url https://github.com/DataZooDE/erpl-rev \
              --readme README.md
          done
          ls -la dist/*.whl
          n=$(ls dist/*.whl | wc -l)
          [ "$n" -eq 3 ] || { echo "::error::expected 3 wheels, got $n"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-wheels
          path: dist/*.whl

  pypi-publish:
    name: Publish to PyPI
    needs: pypi-wheels
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/erpl-rev
    permissions:
      id-token: write        # Trusted Publishing: no API token to store or rotate
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Publish release
    needs: [posix, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Collect assets + checksums
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          ( cd release && sha256sum * > SHA256SUMS.txt )
          ls -la release
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true
          files: release/*
          body: |
            **erpl-rev — query and replicate SAP through DuckDB.**

            Single self-extracting binaries — download the one for your OS, then
            run it. There is nothing else to install.

            All three builds talk RFC through `erpl-proto`, our pure-Rust
            implementation, linked statically. They carry no SAP NW RFC SDK and
            no ICU — DuckDB is the only bundled library.

            The Linux build is additionally exercised by a 13-stage end-to-end
            suite against a live ABAP system. macOS and Windows are verified to
            build, link and start, but not yet against a live SAP system.

            | OS | Asset |
            |----|-------|
            | Linux x86-64 | `erpl-rev-linux-amd64.tar.gz` |
            | macOS arm64 | `erpl-rev-macos-arm64.tar.gz` |
            | Windows x64 | `erpl-rev-windows-amd64.zip` |

            Verify with `SHA256SUMS.txt`. See the [README](https://github.com/DataZooDE/erpl-rev#readme)
            for setup and the [LICENSE](https://github.com/DataZooDE/erpl-rev/blob/main/LICENSE) (BSL 1.1).

  docker:
    name: Docker image (linux/amd64 -> ghcr.io)
    # The image bakes the EXACT linux bundle the posix job built — so what's
    # downloaded and what's deployed in Docker are the same, single artifact (no
    # separate build/stage path). Release-only, gated to v* tags like the release job.
    needs: [posix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to ghcr.io
    steps:
      - uses: actions/checkout@v4   # for the Dockerfile + .dockerignore

      - name: Resolve version
        id: ver
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"   # v2026.06.13 -> 2026.06.13

      - name: Download the linux bundle (from the posix job)
        uses: actions/download-artifact@v4
        with:
          name: erpl-rev-linux-amd64.tar.gz
          path: dl

      - name: Assemble the Docker build context
        run: |
          mkdir -p ctx
          tar -xzf dl/erpl-rev-linux-amd64.tar.gz -C ctx   # -> ctx/erpl-rev-linux-amd64
          mv ctx/erpl-rev-linux-amd64 ctx/erpl-rev          # the name the Dockerfile COPYs
          cp Dockerfile .dockerignore ctx/

      - name: Build the image (linux/amd64)
        run: |
          docker build -t "ghcr.io/datazoode/erpl-rev:${{ steps.ver.outputs.v }}" \
                       -t "ghcr.io/datazoode/erpl-rev:latest" ctx

      - name: Smoke-test the image (runs the bundle, no gateway)
        run: docker run --rm "ghcr.io/datazoode/erpl-rev:${{ steps.ver.outputs.v }}" --smoke

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          docker push "ghcr.io/datazoode/erpl-rev:${{ steps.ver.outputs.v }}"
          docker push "ghcr.io/datazoode/erpl-rev:latest"
