name: Release bundles

# Builds the single-file self-extracting binary for Linux, macOS and Windows.
# Run manually (workflow_dispatch) or on a version tag (v*), which also publishes
# a GitHub release with the three artifacts attached.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  id-token: write      # GitHub OIDC -> AWS (fetch the SAP NW RFC SDK from S3)
  contents: write      # create releases

env:
  DUCKDB_VERSION: "1.5.3"

jobs:
  posix:
    name: bundle ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, sub: linux, plat: linux, triplet: x64-linux,
              sdk: nwrfc750P_13-70002752_linux.zip, duckdb: libduckdb-linux-amd64.zip,
              asset: erpl-rev-linux-amd64 }
          - { os: macos-14, sub: osx, plat: osx, triplet: arm64-osx,
              sdk: nwrfc750P_13-80008131_osx_arm.zip, duckdb: libduckdb-osx-universal.zip,
              asset: erpl-rev-macos-arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ninja-build unzip;
          else brew install ninja; fi

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 11bbc873e00e9e58d4e9dffb30b7a5493a030e0b

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::331993160594:role/ErplGithubOicdRole
          role-session-name: ErplRevReleaseOidc
          aws-region: eu-west-1

      - name: Fetch SAP NW RFC SDK
        run: ./scripts/download_and_extract_nwrfc.sh "s3://erpl-resources/sapnwrfc/${{ matrix.sdk }}" "./nwrfcsdk/${{ matrix.sub }}/"

      - name: Fetch DuckDB
        run: |
          curl -sL --fail -o duckdb.zip "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/${{ matrix.duckdb }}"
          mkdir -p "vendor/duckdb-${DUCKDB_VERSION}"
          unzip -o duckdb.zip -d "vendor/duckdb-${DUCKDB_VERSION}"

      - name: Build (server + launcher)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DDUCKDB_DIST="$PWD/vendor/duckdb-${DUCKDB_VERSION}"
          cmake --build build

      - name: Assemble single-file bundle
        run: ./scripts/bundle.sh ${{ matrix.plat }} build/erpl_rev_server build/erpl_rev_launch "nwrfcsdk/${{ matrix.sub }}/lib" "vendor/duckdb-${DUCKDB_VERSION}" "dist/${{ matrix.asset }}"

      - name: Smoke test (self-extract, no external libs)
        run: env -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH "./dist/${{ matrix.asset }}" --help

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  windows:
    name: bundle erpl-rev-windows-amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 11bbc873e00e9e58d4e9dffb30b7a5493a030e0b

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::331993160594:role/ErplGithubOicdRole
          role-session-name: ErplRevReleaseOidc
          aws-region: eu-west-1

      - name: Fetch SAP NW RFC SDK
        run: .\scripts\download_and_extract_nwrfc.ps1 "s3://erpl-resources/sapnwrfc/nwrfc750P_13-70002755_win.zip" ".\nwrfcsdk\win\"

      - name: Fetch DuckDB
        run: |
          curl.exe -sL --fail -o duckdb.zip "https://github.com/duckdb/duckdb/releases/download/v$env:DUCKDB_VERSION/libduckdb-windows-amd64.zip"
          New-Item -ItemType Directory -Force -Path "vendor\duckdb-$env:DUCKDB_VERSION" | Out-Null
          Expand-Archive -Force duckdb.zip -DestinationPath "vendor\duckdb-$env:DUCKDB_VERSION"

      - name: Build (server + launcher)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DDUCKDB_DIST="$PWD/vendor/duckdb-$env:DUCKDB_VERSION"
          cmake --build build --config Release

      - name: Assemble single-file bundle
        run: .\scripts\bundle.ps1 -Server build\Release\erpl_rev_server.exe -Launcher build\Release\erpl_rev_launch.exe -SdkLib nwrfcsdk\win\lib -DuckdbDir "vendor\duckdb-$env:DUCKDB_VERSION" -Out dist\erpl-rev-windows-amd64.exe

      - name: Smoke test (self-extract)
        run: .\dist\erpl-rev-windows-amd64.exe --help

      - uses: actions/upload-artifact@v4
        with:
          name: erpl-rev-windows-amd64
          path: dist\erpl-rev-windows-amd64.exe

  release:
    name: Publish release
    needs: [posix, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
