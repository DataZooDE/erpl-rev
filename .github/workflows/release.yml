name: Release bundles

# Builds the single-file self-extracting binary for Linux, macOS and Windows.
# Run manually (workflow_dispatch) or on a version tag (v*), which also publishes
# a GitHub release with the three artifacts attached AND a linux/amd64 Docker
# image (ghcr.io/datazoode/erpl-rev:<version> + :latest).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  id-token: write      # GitHub OIDC -> AWS (fetch the SAP NW RFC SDK from S3)
  contents: write      # create releases

env:
  DUCKDB_VERSION: "1.5.3"

jobs:
  posix:
    name: bundle ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, sub: linux, plat: linux, triplet: x64-linux,
              sdk: nwrfc750P_13-70002752_linux.zip, duckdb: libduckdb-linux-amd64.zip,
              asset: erpl-rev-linux-amd64 }
          - { os: macos-14, sub: osx, plat: osx, triplet: arm64-osx,
              sdk: nwrfc750P_13-80008131_osx_arm.zip, duckdb: libduckdb-osx-universal.zip,
              asset: erpl-rev-macos-arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # third_party/posthog-telemetry (telemetry lib)

      - name: Install build tools
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ninja-build unzip;
          else brew install ninja; fi

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 11bbc873e00e9e58d4e9dffb30b7a5493a030e0b

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::331993160594:role/ErplGithubOicdRole
          role-session-name: ErplRevReleaseOidc
          aws-region: eu-west-1

      - name: Fetch SAP NW RFC SDK
        run: ./scripts/download_and_extract_nwrfc.sh "s3://erpl-resources/sapnwrfc/${{ matrix.sdk }}" "./nwrfcsdk/${{ matrix.sub }}/"

      - name: Fetch DuckDB
        run: |
          curl -sL --fail -o duckdb.zip "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/${{ matrix.duckdb }}"
          mkdir -p "vendor/duckdb-${DUCKDB_VERSION}"
          unzip -o duckdb.zip -d "vendor/duckdb-${DUCKDB_VERSION}"

      - name: Build (server + launcher)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DERPL_REV_VERSION="${GITHUB_REF_NAME#v}" \
            -DDUCKDB_VERSION="${DUCKDB_VERSION}" \
            -DDUCKDB_DIST="$PWD/vendor/duckdb-${DUCKDB_VERSION}"
          cmake --build build

      - name: Assemble single-file bundle
        run: ./scripts/bundle.sh ${{ matrix.plat }} build/erpl_rev_server build/erpl_rev_launch "nwrfcsdk/${{ matrix.sub }}/lib" "vendor/duckdb-${DUCKDB_VERSION}" "dist/${{ matrix.asset }}"

      - name: Smoke test (self-extract, load bundled SAP SDK + DuckDB, no external libs)
        run: env -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH "./dist/${{ matrix.asset }}" --smoke

      - name: Package (tar.gz preserves the exec bit)
        run: tar -czf "dist/${{ matrix.asset }}.tar.gz" -C dist "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}.tar.gz
          path: dist/${{ matrix.asset }}.tar.gz

  windows:
    name: bundle erpl-rev-windows-amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # third_party/posthog-telemetry (telemetry lib)

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 11bbc873e00e9e58d4e9dffb30b7a5493a030e0b

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::331993160594:role/ErplGithubOicdRole
          role-session-name: ErplRevReleaseOidc
          aws-region: eu-west-1

      - name: Fetch SAP NW RFC SDK
        run: .\scripts\download_and_extract_nwrfc.ps1 "s3://erpl-resources/sapnwrfc/nwrfc750P_13-70002755_win.zip" ".\nwrfcsdk\win\"

      - name: Fetch DuckDB
        run: |
          curl.exe -sL --fail -o duckdb.zip "https://github.com/duckdb/duckdb/releases/download/v$env:DUCKDB_VERSION/libduckdb-windows-amd64.zip"
          New-Item -ItemType Directory -Force -Path "vendor\duckdb-$env:DUCKDB_VERSION" | Out-Null
          Expand-Archive -Force duckdb.zip -DestinationPath "vendor\duckdb-$env:DUCKDB_VERSION"

      - name: Build (server + launcher)
        run: |
          # x64-windows-static-md: statically link OpenSSL (no libssl/libcrypto
          # DLLs in the single-file bundle) while keeping the dynamic CRT (/MD)
          # to match the prebuilt DuckDB DLL.
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DERPL_REV_VERSION="$($env:GITHUB_REF_NAME -replace '^v','')" `
            -DDUCKDB_VERSION="$env:DUCKDB_VERSION" `
            -DDUCKDB_DIST="$PWD/vendor/duckdb-$env:DUCKDB_VERSION"
          cmake --build build --config Release

      - name: Assemble single-file bundle
        run: .\scripts\bundle.ps1 -Server build\Release\erpl_rev_server.exe -Launcher build\Release\erpl_rev_launch.exe -SdkLib nwrfcsdk\win\lib -DuckdbDir "vendor\duckdb-$env:DUCKDB_VERSION" -Out dist\erpl-rev-windows-amd64.exe

      - name: Smoke test (self-extract, load bundled SAP SDK + DuckDB)
        run: .\dist\erpl-rev-windows-amd64.exe --smoke

      - name: Package (zip)
        run: Compress-Archive -Force -Path dist\erpl-rev-windows-amd64.exe -DestinationPath dist\erpl-rev-windows-amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: erpl-rev-windows-amd64.zip
          path: dist\erpl-rev-windows-amd64.zip

  release:
    name: Publish release
    needs: [posix, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Collect assets + checksums
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          ( cd release && sha256sum * > SHA256SUMS.txt )
          ls -la release
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true
          files: release/*
          body: |
            **erpl-rev — query and replicate SAP through DuckDB.**

            Single self-extracting binaries — download the one for your OS, then
            run it. They bundle the SAP NW RFC SDK + DuckDB, so there is nothing
            else to install.

            | OS | Asset |
            |----|-------|
            | Linux x86-64 | `erpl-rev-linux-amd64.tar.gz` |
            | macOS arm64 | `erpl-rev-macos-arm64.tar.gz` |
            | Windows x64 | `erpl-rev-windows-amd64.zip` |

            Verify with `SHA256SUMS.txt`. See the [README](https://github.com/DataZooDE/erpl-rev#readme)
            for setup and the [LICENSE](https://github.com/DataZooDE/erpl-rev/blob/main/LICENSE) (BSL 1.1).

  docker:
    name: Docker image (linux/amd64 -> ghcr.io)
    # The image bakes the EXACT linux bundle the posix job built — so what's
    # downloaded and what's deployed in Docker are the same, single artifact (no
    # separate build/stage path). Release-only, gated to v* tags like the release job.
    needs: [posix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to ghcr.io
    steps:
      - uses: actions/checkout@v4   # for the Dockerfile + .dockerignore

      - name: Resolve version
        id: ver
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"   # v2026.06.13 -> 2026.06.13

      - name: Download the linux bundle (from the posix job)
        uses: actions/download-artifact@v4
        with:
          name: erpl-rev-linux-amd64.tar.gz
          path: dl

      - name: Assemble the Docker build context
        run: |
          mkdir -p ctx
          tar -xzf dl/erpl-rev-linux-amd64.tar.gz -C ctx   # -> ctx/erpl-rev-linux-amd64
          mv ctx/erpl-rev-linux-amd64 ctx/erpl-rev          # the name the Dockerfile COPYs
          cp Dockerfile .dockerignore ctx/

      - name: Build the image (linux/amd64)
        run: |
          docker build -t "ghcr.io/datazoode/erpl-rev:${{ steps.ver.outputs.v }}" \
                       -t "ghcr.io/datazoode/erpl-rev:latest" ctx

      - name: Smoke-test the image (runs the bundle, no gateway)
        run: docker run --rm "ghcr.io/datazoode/erpl-rev:${{ steps.ver.outputs.v }}" --smoke

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          docker push "ghcr.io/datazoode/erpl-rev:${{ steps.ver.outputs.v }}"
          docker push "ghcr.io/datazoode/erpl-rev:latest"
