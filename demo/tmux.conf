# Hermetic stage for the recording: neither ~/.tmux.conf nor the operator's
# prompt reaches the frame, so a re-render on another machine looks the same.
set -g status off
set -g mouse off
set -g escape-time 0
set -g default-terminal "xterm-256color"
set -g pane-border-status top
set -g pane-border-format '#{?pane_index, erpl-rev top (untouched) , SAP: goods movements }'
set -g pane-border-style        'fg=#585b70'
set -g pane-active-border-style 'fg=#585b70'
setw -g allow-rename off
